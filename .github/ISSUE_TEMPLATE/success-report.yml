name: "It works on my Mac!"
description: "Share a successful install to help establish compatibility."
title: "[Success] "
labels: ["documentation"]
body:
  - type: input
    id: model
    attributes:
      label: Mac model
      description: "Find this with cat /sys/class/dmi/id/product_name if needed. No serial numbers, please."
      placeholder: "MacBookPro13,2"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Ubuntu version / kernel
      placeholder: "Ubuntu 26.04.1; 7.0.0-43-generic"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What did you actually test?
      options:
        - label: "Built-in speakers played audio"
        - label: "Microphone recorded sound"
        - label: "Touch Bar/function keys responded"
        - label: "Wi-Fi joined, transferred data and reconnected (include band in notes)"
        - label: "Headphone jack switched and played audio"
        - label: "Camera preview worked after Touch Bar setup"
  - type: textarea
    id: notes
    attributes:
      label: Any observations?
      description: "Do not include serial numbers, MAC addresses or unredacted logs."
